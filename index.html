<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site is live</title>
<style>
  :root {
    --ink: #1c2b2a;
    --paper: #f6f5f1;
    --accent: #3a6b5f;
    --line: #d8d6cd;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  main {
    max-width: 520px;
    width: 100%;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--accent);
    margin-bottom: 20px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }
  h1 {
    font-size: clamp(2rem, 5vw, 2.75rem);
    line-height: 1.15;
    margin: 0 0 16px;
    letter-spacing: -0.01em;
  }
  p {
    font-size: 1.05rem;
    line-height: 1.6;
    color: #4a5654;
    margin: 0 0 28px;
    max-width: 44ch;
  }
  .domain {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 0.95rem;
    color: var(--ink);
    display: inline-block;
  }
  footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 0.85rem;
    color: #7c8684;
  }
</style>
</head>
<body>
  <main>
    <div class="status"><span class="dot"></span>Deployed via GitHub Pages</div>
    <h1>It&rsquo;s live.</h1>
    <p>This page confirms your repository is publishing correctly and, if you've pointed DNS here, that your custom domain is resolving too.</p>
    <span class="domain" id="host">loading host&hellip;</span>
    <footer>Replace this file with your real site whenever you're ready.</footer>
  </main>
  <script>
    document.getElementById('host').textContent = window.location.hostname;
  </script>
</body>
</html>
